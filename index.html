<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Web</title>
  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
    }

    /* Contenedor principal */
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    /* Encabezados y texto */
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 15px;
    }

    /* Botón */
    .btn {
      display: inline-block;
      background-color: #3498db;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>¡Hola, mundo!</h1>
    <p>Esta es una estructura básica con HTML y CSS integrados en la etiqueta <code>&lt;style&gt;</code>.</p>
    <a href="#" class="btn">Unirse</a>
  </div>

</body>
</html>
